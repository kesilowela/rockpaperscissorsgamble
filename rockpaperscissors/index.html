
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Gamble</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-container">
    <h1>Rock Paper Scissors Gamble</h1>

    <section class="stats">
      <p>Lives: <span id="lives"> 3 </span></p>
      <p>Score: <span id="score">0</span></p>
    </section>

    <section class="prediction-section">
      <h2>1. Predict the computer's move</h2>
      <div id="prediction-buttons">
        <button class="choice-button" data-move="rock"> Rock</button>
        <button class="choice-button" data-move="paper"> Paper</button>
        <button class="choice-button" data-move="scissors"> Scissors</button>
      </div>
    </section>

    <section class="choice-section">
      <h2>2. Choose your move</h2>
      <div id="move-buttons">
        <button class="choice-button" data-move="rock"> Rock</button>
        <button class="choice-button" data-move="paper"> Paper</button>
        <button class="choice-button" data-move="scissors"> Scissors</button>
      </div>
    </section>

    <section id="result">
      <p>Make a prediction to get started!</p>
    </section>

    <button id="restart-button">New Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
